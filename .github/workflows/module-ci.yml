name: module-ci

# CI di UN singolo modulo go-core, richiamabile dal repo del modulo.
#
# È un reusable workflow (`workflow_call`) e non un file da copiare nei sette repo: il caller è di
# sei righe, la logica sta qui. Sette copie sarebbero sette copie che divergono, e la copia che
# diverge in silenzio è sempre quella che qualcuno sta usando davvero.
#
# Le librerie si sviluppano insieme in un workspace Go, dove ogni build usa i sorgenti locali.
# Questa CI gira nel repo della singola libreria, quindi **senza `go.work` per costruzione**: è la
# verifica che il modulo sia consumabile da solo — ciò che vede chi ne fa `go get` — eseguita nel
# momento in cui una discrepanza fra codice e `go.mod` verrebbe introdotta.

on:
  workflow_call:
    inputs:
      go-version-file:
        description: File da cui dedurre la versione di Go.
        type: string
        default: go.mod
      cgo:
        description: >-
          CGO_ENABLED. go-core-kafka è su confluent-kafka-go (CGo su librdkafka) e richiede "1".
        type: string
        default: '1'

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: ${{ inputs.cgo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # il gating del linter sul codice nuovo ha bisogno della storia

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: go.sum

      # Nessun GOWORK=off: qui il workspace non c'è proprio. È il punto — questa build vede
      # esattamente ciò che vede un consumatore esterno che fa `go get` del modulo.
      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: gofmt
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "file non formattati:"; echo "$fmt"; exit 1
          fi

      # -count=2 disabilita la cache dei test ed esegue ogni test due volte nello stesso processo:
      # è ciò che smaschera lo stato globale che sopravvive fra un test e l'altro: un registro di
      # package, un driver registrato in database/sql, una fx.App che non rilascia le registrazioni.
      - name: test (ripetibilità)
        run: go test -race -count=2 ./...

      # Compilati con la toolchain di setup-go, non scaricati precompilati: un binario precompilato
      # è precisamente come ci si ritrova con strumenti più vecchi dei sorgenti.
      #
      # Sulla schedulata questo è il passo che conta: una CVE nuova compare senza che il codice
      # cambi, quindi una CI che gira solo sui commit non la vedrebbe mai.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # La configurazione del linter vive in questo stesso repo, in copia unica: la libreria che
      # viene analizzata non la contiene, quindi va portata qui e passata con -c. Senza, golangci
      # userebbe i default e la configurazione condivisa non avrebbe alcun effetto in CI.
      - name: configurazione condivisa del linter
        uses: actions/checkout@v4
        with:
          repository: GPA-Gruppo-Progetti-Avanzati-SRL/go-core-ci
          ref: main
          path: .ci-shared

      # Solo sul codice nuovo: le librerie hanno un debito di lint pregresso e bloccare tutto
      # renderebbe rossa la CI dal primo giorno — una CI rossa dal primo giorno viene ignorata.
      - name: golangci-lint (codice nuovo)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            golangci-lint run -c .ci-shared/.golangci.yml --new-from-merge-base=origin/${{ github.base_ref }} ./...
          else
            golangci-lint run -c .ci-shared/.golangci.yml --new-from-rev=HEAD~1 ./...
          fi
